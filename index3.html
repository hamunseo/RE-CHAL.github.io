  <script>
    const OPENAI_KEY = prompt("OpenAI API Key를 입력하세요");
    window.addEventListener('DOMContentLoaded', fetchAndRenderCards);

    async function clearGeneratedCards() {
      const snap = await window.get(window.col(window.db, 'generatedCards'));
      const jobs = [];
      snap.forEach(d => jobs.push(window.del(window.doc(window.db, 'generatedCards', d.id))));
      await Promise.all(jobs);
    }
//선택된 카드데이터에 증거리뷰가 있으면 리뷰 카드 렌더링
    function renderReviewCards(selectedCard) {
      const reviewWrap = document.getElementById('reviewEvidenceContainer');
      reviewWrap.innerHTML = '';

      if (!selectedCard.cardData || !selectedCard.cardData.증거리뷰) return;

      const reviews = selectedCard.cardData.증거리뷰;
      const layoutOrder = ['left-top', 'left-bottom', 'right-top', 'right-bottom'];

      reviews.slice(0, 4).forEach((r, idx) => {
        const card = document.createElement('div');
        card.className = `review-card ${layoutOrder[idx] || ''}`;
        card.innerHTML = `
          <div class="quote">  <img src="image/quote.png" alt="quote" class="quote-icon"></div>
          <div class="review-text">${r.원문}</div>
        `;
        reviewWrap.appendChild(card);
      });
    }

// 로딩스패너
function showSpinner() {
  document.getElementById('loadingSpinner').style.display = 'flex';
}

function hideSpinner() {
  document.getElementById('loadingSpinner').style.display = 'none';
}


    async function fetchAndRenderCards() {
      if (localStorage.uxCards && OPENAI_KEY) {
        const regen = confirm('기존 저장된 과제를 지우고 새로 생성하시겠습니까?');
        if (regen) {
          localStorage.removeItem('uxCards');
          localStorage.removeItem('uxCardIds');
          localStorage.removeItem('cardsSavedToFirestore');
          await clearGeneratedCards();
        }
      }

      let cardIds = JSON.parse(localStorage.uxCardIds || 'null');

[조건]
1) 아래 실제 사용자 리뷰를 분석하여 ‘반복적으로 나타나는 잘못된 UI로 인한 UX 불편’을 도출할 것
2) “단순 오류·기술 결함·데이터 오류”처럼 기술, 기능상의 오류로 디자인으로 해결할 수 없는 과제는 제외  
3) 문제는 UX 리서치 & GUI 설계로 해결 가능한 수준이어야 함  
4) Nielsen 5가지 사용성 기준 (학습용이성/사용효율성/기억용이성/적은오류/만족도) 중 하나로 분류  
5) 각 과제마다 UX 해결전략을 3개 제시

7) 증거리뷰는 과제별 3~4개로 제한(최소 3개, 최대 4개). 가장 관련도가 높은 리뷰를 선택
8) 증거리뷰에 포함되는 "원문"은, 관련 문장을 포함하고 있는 전체 리뷰 텍스트 전체를 그대로 기입한다. 리뷰 텍스트가 너무 길다면 관련 문장을 포함한 부분만 표시
9) 동일 리뷰가 여러 과제의 증거가 될 수 있음(중복 허용)
10) 설명·주석·추가 문장 없이, 순수 JSON 배열만 반환
11) 문제점과 사용자니즈는 여러 리뷰들에서 공통된 문제점과 요구 사항을 도출할 것 리뷰데이터의 원문을 그대로 사용하지 말고 여러 리뷰들에서 나타난 문제점과 사용자 니즈를 분석하여 근본적인 문제점과 사용자니즈를 도출
12) 문제점: 단순히 "기능이 안 됨/어려움"이 아니라 [사용자의 행동 + 시스템의 문제 반응 + 결과적 불편]의 구성을 갖추도록 지시.
13) 사용자 니즈: 단순 "원함"이 아니라 [어떤 가치/환경을 위해 무엇이 필요한지] 구체화.


[요청]
- 최소 5개의 JSON 과제 객체를 “배열” 형태로만 응답

[생성 규칙]
- 최소 5개 과제를 생성하되, **증거리뷰가 2개 미만인 후보 과제는 제외**하고 다른 과제로 대체

[리뷰 ID 규칙]
